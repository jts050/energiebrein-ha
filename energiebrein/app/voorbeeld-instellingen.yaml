# Energiebrein — instellingen
# Kopieer naar config.yaml en pas aan. Alles wat je hier niet hebt, laat je op "uit" staan.

simulatie: true          # true = geen echte apparaten, het huis wordt nagebootst (om te proberen)

locatie:
  breedte: 53.30          # breedtegraad (voor zonvoorspelling)
  lengte: 6.20            # lengtegraad

# ---------- Stroomprijs: rechtstreeks van de beurs, niet van je leverancier ----------
prijzen:
  bron: entsoe            # entsoe (officieel, gratis token) of energyzero (geen token nodig)
  entsoe_token: ""        # gratis aan te vragen via transparency.entsoe.eu
  tibber_token: ""        # alleen bij Tibber: persoonlijke code van developer.tibber.com → je echte Tibber-prijs
  energyzero_aftrek: 0.0916   # EnergyZero-prijs bevat energiebelasting excl. btw; dit trekken we eraf → kale beursprijs
  leverancier: frank      # frank, anwb, next, energyzero, zonneplan, tibber, vandebron of anders
  contract: dynamisch     # dynamisch of vast
  opslag: 0.015           # € per kWh excl. btw bovenop de beursprijs (staat in je contract)
  terugleverkosten: 0.010 # € per kWh excl. btw die je leverancier inhoudt bij teruglevering
  energiebelasting: 0.1108  # € per kWh incl. btw (2026: 9,16 ct excl. btw)
  btw: 0.21
  saldering: auto        # auto = tot 1 januari 2027 meerekenen (dan stopt de salderingsregeling), aan of uit
  vast_inkoop: 0.28       # alleen bij contract: vast — € per kWh alles inbegrepen
  vast_teruglever: 0.05

# ---------- Aansluiting ----------
net:
  max_afname_kw: 17.0     # 3 x 25 A ≈ 17 kW. De regelaar knijpt de laadpaal af als je hierboven dreigt te komen.
  p1:
    type: homewizard      # homewizard, youless, p1monitor, shelly_em, esphome, tibber of uit
    sleutel: ""           # alleen esphome: encryptiesleutel (api encryption key)
    host: 192.168.1.50

# ---------- Zonnepanelen + thuisaccu ----------
omvormer:
  type: goodwe            # goodwe, huawei, victron, sungrow, solaredge, sma, fronius, sessy, enphase, deye, sunspec of uit
  host: 192.168.1.60
  sturen: false           # pas aanzetten als uitlezen klopt (GoodWe stuurt altijd)
  vermogen_kw: 8          # vermogen van de omvormer; laden/leveren max stel je in als % hiervan (GW8K-ET = 8 kW)
  modbus_poort: 502       # SolarEdge meestal 1502, Huawei via interne wifi 6607
  modbus_unit: 1          # SMA 3; Victron gebruikt altijd 100
  gebruiker: ""           # Sessy (sticker) of Enphase (Enlighten-account)
  wachtwoord: ""          # Sessy, Enphase, of Huawei-installateurswachtwoord (nodig om te sturen)
  serienummer: ""         # Deye: serienummer van de Solarman-stick
  houd_vast_modus: eco_charge_0   # hoe 'accu vasthouden' wordt gedaan; testen op jouw omvormer
  aftoppen_bij_negatieve_prijs: true

zonnepanelen:            # voor de zonvoorspelling (forecast.solar), één regel per dakvlak
  - kwp: 4.0
    hoek: 35              # helling in graden
    richting: 0           # 0 = zuid, -90 = oost, 90 = west
  - kwp: 2.0
    hoek: 35
    richting: -90

accu:
  capaciteit_kwh: 10.0
  max_laden_kw: 5.0
  max_ontladen_kw: 5.0
  min_soc: 10             # % die altijd in de accu blijft (back-up)
  max_soc: 100
  rendement: 0.92         # rendement heen en terug
  slijtage_per_kwh: 0.02     # € per kWh die door de accu gaat (slijtage); terugverkopen moet meer opleveren dan dit
  min_winst_per_kwh: 0.03    # € die laden en later gebruiken of verkopen per kWh minstens moet opleveren, bovenop slijtage
  terugverkopen: true        # true = de accu mag stroom aan het net verkopen; false = de accu voedt alleen je eigen huis

# ---------- Laadpaal (OCPP 1.6) ----------
laadpaal:
  type: ocpp              # ocpp, goe, tesla (alleen uitlezen) of uit — bij ocpp: stel in de laadpaal-app de OCPP-server in op ws://<ip-van-dit-kastje>:9000/<naam>
  host: ""                # alleen voor goe: IP-adres van de laadpaal
  poort: 9000
  fasen: 3
  min_stroom_a: 6
  max_stroom_a: 16
  auto_accu_kwh: 58       # VW ID.3: 58 kWh netto
  standaard_doel_kwh: 20  # hoeveel kWh er bij vertrek bij moet zijn
  standaard_vertrek: "07:30"

# ---------- Warmtepomp (SG-ready via twee Shelly-relais) ----------
warmtepomp:
  type: uit               # sgready_shelly of uit
  relais1: 192.168.1.70   # SG-ready contact 1
  relais2: 192.168.1.71   # SG-ready contact 2
  meter: ""              # IP van een Shelly-energiemeter op de groep van de warmtepomp (leeg = schatten)
  vermogen_kw: 2.0
  boost_uren_per_dag: 3   # hoeveel uur hij extra mag stoken op goedkope momenten
  blokkeer_uren_per_dag: 2  # hoeveel uur hij mag wachten op dure momenten
  max_wacht_achter_elkaar_uur: 1.5   # nooit langer achter elkaar wachten; daarna minstens 2 uur normaal
  niet_wachten_onder_c: 2            # bij buitentemperatuur onder dit getal nooit laten wachten (comfort en vorst)
  comfort_tijden: ["06:00-08:30", "18:30-22:30"]   # douchen e.d.: hier en het uur ervoor nooit wachten
  jaarverbruik_kwh: 2500

huis:
  jaarverbruik_kwh: 3500  # startwaarde; daarna leert het systeem je echte verbruik

regelaar:
  interval_s: 10          # hoe vaak de regelaar kijkt en bijstuurt
  plan_interval_min: 15   # hoe vaak een nieuw plan wordt gemaakt

web:
  poort: 8080

# ---------- Abonnement (Plus) ----------
licentie:
  server: ""              # adres van de licentieserver, bijv. https://licentie.accumaatje.nl — leeg = eigen gebruik, alles staat aan
  sleutel: ""             # licentiecode van de klant, bijv. EB-ABCD-EFGH-JKLM (ook in te vullen in de app)

# ---------- Je auto (laadstand uitlezen, niet verplicht) ----------
auto:
  merk: uit               # volkswagen, audi, skoda, seatcupra of uit
  gebruiker: ""           # e-mail van het account van je auto (dezelfde als in de app van je auto)
  wachtwoord: ""
  spin: ""                # alleen nodig bij sommige merken (S-PIN)
  vin: ""                 # leeg = de eerste auto op je account

# Meldingen op je telefoon via de Home Assistant-app (werkt alleen als Energiebrein in Home Assistant draait).
# Kies je telefoon in de app bij Koppelen → Telefoon, of vul de notify-dienst zelf in, bijvoorbeeld mobile_app_iphone_van_jordy.
meldingen:
  telefoon: ""
  bij_opgelost: true
